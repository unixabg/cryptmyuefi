###############################################################################
## cryptmyuefi - Debian unencrypted, UEFI-only example
###############################################################################

# Debian release
export _DEB_RELEASE="bookworm"

# Debian mirror for debootstrap
export _DEB_MIRROR="http://deb.debian.org/debian"

# Hostname for the installed system
export _HOSTNAME="debian-uefi"

# Use _IMAGEURL to describe the base system instead of a tarball URL
export _IMAGEURL="debootstrap:${_DEB_RELEASE}:${_DEB_MIRROR}"

# Timezone (passed into chroot by your hooks)
export _TIMEZONE="UTC"

# LUKS ENCRYPTION -------------------------------------------------------------
## Encryption Cipher
export _LUKSCIPHER="aes-cbc-essiv:sha256"

## Encryption Password
export _LUKSPASSWD="luks_password"

## Stage2 regenerate luks uuid
# A value of yes generates a new luks uuid for deployment
export _NEWLUKSUUID="no"

## Encryption Extra
# On RPi0-1-2-3 you may want to reduce the required memory to unlock
#  _LUKSEXTRA="--pbkdf-memory 131072"
export _LUKSEXTRA="--key-size 256"


###############################################################################
## Stage-2 target device
# Block device to completely wipe / repartition!
# You MUST set this correctly before running.
export _BLKDEV="/dev/sdX"

# Filesystem for root
export _ROOT_FS_TYPE="ext4"

# ESP size (for your partitioning hook to use)
export _ESP_SIZE_MIB="512"

# Label for the ESP and root FS (optional, but handy)
export _ESP_LABEL="EFI-SYSTEM"
export _ROOT_LABEL="debian-root"

###############################################################################
## Package sets
# Extra packages to install into the Debian system (inside chroot)
# Keep this small for now; you can expand later.
export _PKGSINSTALL="systemd-sysv locales sudo vim ssh net-tools"

# Packages to remove after initial install (if any)
export _PKGSPURGE=""

# MINIMAL SSH CONFIG ----------------------------------------------------------
#   Keyfile to be used to access the system remotely through ssh.
#   Its public key will be added to the system's root .ssh/authorized_keys
export _SSH_LOCAL_KEYFILE="$_USER_HOME/.ssh/id_ed25519.pub"


###############################################################################
# For amd64: grub-efi-amd64 / shim-signed
# For arm64: grub-efi-arm64 / shim-signed
# (Your hooks should switch on $_ARCH and install the right ones.)
export _GRUB_PKG_AMD64="grub-efi-amd64 shim-signed"
export _GRUB_PKG_ARM64="grub-efi-arm64 shim-signed"

###############################################################################
# Removable media fallback path – your grub-install hook should ensure
# something ends up at EFI/BOOT/BOOTX64.EFI (or BOOTAA64.EFI for arm64).
export _UEFI_REMOVABLE_DIR="EFI/BOOT"
export _UEFI_REMOVABLE_AMD64="BOOTX64.EFI"
export _UEFI_REMOVABLE_ARM64="BOOTAA64.EFI"

###############################################################################
## Stage 1 Settings ###########################################################

# Custom Stage1 Profile
#   Check functions/stage1profiles.fns for reference. You may instruct hooks
#   here or you may call one predefined stage1profile functions.
#   Optional function:
#   - if stage1_hooks is not defined, you will be prompted
#   - declare it if you want to skip script prompt predefining it
stage1_hooks(){
    stage1profile_basic
}

###############################################################################
## Stage-2 Settings ###########################################################

# Optional stage 2 hooks
#   If declared, this function is called during stage2 build by the
#   stage2-runoptional hook.
#
#   Optional function: can be omitted.
stage2_optional_hooks(){
    myhooks "optional-sys-rootpassword"
}

###############################################################################
##Optional Hook Settings #####################################################


# ROOT PASSWORD CHANGER settings ----------------------------------------------
# Hooks
#   optional-sys-rootpassword
#       Changes the system root password

## The new root password
export _ROOTPASSWD="root_password"


